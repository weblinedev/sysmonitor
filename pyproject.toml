[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webline-sysmonitor"
version = "0.1.0"
description = "Private Telegram operations companion for Uptime Kuma"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Amir Hossein Khateri"}]
dependencies = []

[project.scripts]
sysmonitor = "sysmonitor.app:main"

[tool.setuptools]
packages = ["sysmonitor"]
